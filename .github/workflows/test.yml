name: Test
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Optional release run whose saved packages should be checked
        required: false
        type: string
      candidate_installers:
        description: Test current unsigned installer code with the saved signed binaries
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  signing-client:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recover the signing client from a missing package repository
        shell: pwsh
        run: ./scripts/test-signing-client.ps1
  saved-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_run_id != ''
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, system: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, system: linux, arch: arm64}
          - {runner: macos-15-intel, system: darwin, arch: amd64}
          - {runner: macos-15, system: darwin, arch: arm64}
          - {runner: windows-2025, system: windows, arch: amd64}
          - {runner: windows-11-arm, system: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the saved signed packages without another release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        shell: bash
        run: python scripts/check-saved-release.py --run "$RELEASE_RUN_ID" --system ${{ matrix.system }} --arch ${{ matrix.arch }} ${{ inputs.candidate_installers && '--candidate-installers' || '' }}
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows' || runner.arch != 'ARM64'
      - run: go build -o lettermint${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/lettermint
      - run: ./lettermint version --json
        shell: bash
      - name: Terminal and pipe behavior
        if: runner.os != 'Windows'
        run: python3 scripts/test-terminal.py ./lettermint
      - name: Shell installer behavior
        if: runner.os != 'Windows'
        run: python3 scripts/test_install.py
      - name: PowerShell 7 behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-powershell.ps1
      - name: Windows PowerShell 5.1 behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-powershell.ps1
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          install-only: true
      - name: Check GoReleaser configuration
        run: goreleaser check
      - name: Build snapshot packages
        run: goreleaser release --snapshot --clean --skip=publish
      - name: Verify release versions when tags share a commit
        run: python3 scripts/check-release-tags.py
  release-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Release controls
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Scan commit history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all .
      - name: Scan the release source tree
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .

  # The one check branch protection requires. It fails when a job above failed or
  # was cancelled; skipped jobs count as passed.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [signing-client, saved-release, native, package, release-checks]
    runs-on: ubuntu-slim
    steps:
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
