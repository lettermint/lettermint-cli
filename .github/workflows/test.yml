name: Test
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows' || runner.arch != 'ARM64'
      - run: go build -o lettermint${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/lettermint
      - run: ./lettermint version --json
        shell: bash
      - name: Terminal and pipe behavior
        if: runner.os != 'Windows'
        run: python3 scripts/test-terminal.py ./lettermint
      - name: Shell installer behavior
        if: runner.os != 'Windows'
        run: python3 scripts/test_install.py
      - name: PowerShell 7 behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-powershell.ps1
      - name: Windows PowerShell 5.1 behavior
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-powershell.ps1
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.13.2
          args: check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.13.2
          args: release --snapshot --clean --skip=publish
  release-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Release controls
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Scan commit history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all .
      - name: Scan the release source tree
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
